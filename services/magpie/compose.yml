# magpie 服务编排：端口仅绑定 127.0.0.1，不暴露公网
services:
  magpie:
    image: ghcr.io/yetone/magpie:latest
    container_name: magpie
    restart: on-failure:3
    ports:
      - "127.0.0.1:3425:3425"   # 网关（Anthropic/OpenAI 兼容）
      - "127.0.0.1:3430:3430"   # Web UI
    environment:
      TZ: Asia/Shanghai
      MAGPIE_WEB_KEY: ${MAGPIE_WEB_KEY}
      MAGPIE_PUBLIC_URL: ${MAGPIE_PUBLIC_URL}
    volumes:
      - /opt/clouddock-data/magpie:/config
    command: ["web", "--addr", "0.0.0.0:3430", "--no-open"]
