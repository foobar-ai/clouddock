# OpenResty 主配置（低配机：单 worker，站点从 sites/*.conf include）
worker_processes 1;

error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    # 站点配置（由部署脚本写入 new-api.conf）
    # 注意：相对 include 路径以 <prefix>/conf/ 为基准，勿再写 conf/
    include sites/*.conf;
}
