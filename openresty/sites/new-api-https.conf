# 阶段二：证书签发后，443 反代 new-api，80 跳转 HTTPS 并保留 acme challenge（用于续期）
# 占位符 __DOMAIN__ 由 06-openresty-site.sh 渲染替换

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # 保留 acme.sh 续期挑战
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # 临时安全缓解：2026-11-18 披露的 nginx2root 漏洞（CVE-2026-123007 HTTP/2 内存破坏、
    # CVE-2026-123633 HTTP/2+反代 UAF，CVSS 9.2），本机两条命中条件都满足（443 开 h2 + proxy_pass）。
    # OpenResty 至今未发布含 nginx 1.31.9/1.30.7 修复的版本，故先关闭 HTTP/2，堵死这两个洞的触发面。
    # 恢复条件：openresty 官方源出现内置 nginx >= 1.31.9 的版本后，升包并把下面一行改回 `http2 on;`。
    # http2 on;

    server_name __DOMAIN__;

    ssl_certificate     /etc/ssl/clouddock/fullchain.cer;
    ssl_certificate_key /etc/ssl/clouddock/__DOMAIN__.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 流式与 WebSocket 反代到 new-api
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_buffering       off;      # 关闭缓冲，保证流式响应
        proxy_read_timeout    3600s;    # 长连接/流式
        proxy_send_timeout    3600s;
        client_max_body_size  100m;
    }
}
