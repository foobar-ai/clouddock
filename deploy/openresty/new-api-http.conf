# 阶段一：证书签发前，仅 80 端口提供 acme challenge，其余请求直接关闭
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # acme.sh HTTP-01 挑战目录（webroot）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 444;
    }
}
